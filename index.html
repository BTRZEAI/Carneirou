document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:760},&quot;defaultLanguage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pt&quot;,&quot;en&quot;],&quot;default&quot;:&quot;pt&quot;,&quot;tsType&quot;:&quot;'pt' | 'en'&quot;},&quot;introEnabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;introEveryVisit&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;confettiEnabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\n// Portuguese names everywhere — some of these have no clean English equivalent.\nconst ANIMALS = [\n  {key:'onca', file:'onca.jpg', name:'Onça-pintada'},\n  {key:'jaguatirica', file:'jaguatirica.jpg', name:'Jaguatirica'},\n  {key:'lobo-guara', file:'lobo-guara.jpg', name:'Lobo-guará'},\n  {key:'ariranha', file:'ariranha.jpg', name:'Ariranha'},\n  {key:'capivara', file:'capivara.jpg', name:'Capivara'},\n  {key:'tamandua', file:'tamandua.jpg', name:'Tamanduá'},\n  {key:'mico-leao-dourado', file:'mico-leao-dourado.jpg', name:'Mico-leão-dourado'},\n  {key:'sagui', file:'sagui.jpg', name:'Sagui'},\n  {key:'bugio', file:'bugio.jpg', name:'Bugio'},\n  {key:'harpia', file:'harpia.jpg', name:'Harpia'},\n  {key:'arara', file:'arara.jpg', name:'Arara'},\n  {key:'tucano', file:'tucano.jpg', name:'Tucano'},\n  {key:'jacare', file:'jacare.jpg', name:'Jacaré'},\n  {key:'tartaruga', file:'tartaruga.jpg', name:'Tartaruga'},\n  {key:'tubarao', file:'tubarao.jpg', name:'Tubarão'}\n];\n\n// Trimmed to eight that stay distinct for colour-blind eyes (they differ in lightness too).\n// The animal is the unique identity now, so colours may repeat.\nconst COLORS = [\n  {key:'vermelho', pt:'Vermelho', en:'Red',    hex:'oklch(0.55 0.22 27)'},\n  {key:'azul',     pt:'Azul',     en:'Blue',   hex:'oklch(0.52 0.19 260)'},\n  {key:'amarelo',  pt:'Amarelo',  en:'Yellow', hex:'oklch(0.86 0.17 92)'},\n  {key:'verde',    pt:'Verde',    en:'Green',  hex:'oklch(0.63 0.17 145)'}\n];\n\n// Photos come from the inlined data-URI map so the standalone export works offline.\nconst photoUrl = (a) => {\n  if (!a) return null;\n  const map = (typeof window !== 'undefined' && window.CARNEIROS_ANIMAL_PHOTOS) || null;\n  return (map && map[a.key]) || `./animals/${a.file}`;\n};\n\nconst T = (pt, en) => ({pt, en});\nconst P = (text) => ({isText:true, isList:false, text});\nconst L = (items) => ({isText:false, isList:true, items});\n\nconst SECTIONS = [\n  { key:'rooms', tag: T('A CASA','THE HOUSE'),\n    title: T('1. Nossa reserva','1. Our reservation'),\n    pt: [P('A reserva vai de 26/12/2026 a 03/01/2027. O anfitrião é flexível, e nossos horários de check-in e check-out também.'),\n         P('A casa tem 6 suítes. Cada quarto custa R$ 7.500,00, e o valor de cada pessoa depende apenas de quantas pessoas estarão dividindo aquele quarto.'),\n         L(['Sozinho: R$ 7.500,00','Em dupla: R$ 3.750,00 por pessoa','Em trio: R$ 2.500,00 por pessoa'])],\n    en: [P('The reservation runs from 26/12/2026 to 03/01/2027. The host is flexible, and so are our check-in and check-out times.'),\n         P('The house has 6 suites. Each room costs R$ 7,500.00, and what each person pays depends only on how many people are sharing that room.'),\n         L(['On your own: R$ 7,500.00','Two sharing: R$ 3,750.00 each','Three sharing: R$ 2,500.00 each'])] },\n\n  { key:'payments', tag: T('GRANA','MONEY'),\n    title: T('2. Pagamentos','2. Payments'),\n    pt: [P('O pagamento será dividido em três parcelas:'),\n         L(['25% — 01/09/2026','25% — 01/11/2026','50% — 20/12/2026']),\n         P('As datas acompanharão o cronograma de pagamentos que tenho com o proprietário da casa.'),\n         P('A vaga fica garantida conforme os pagamentos forem sendo realizados. Quem antecipar, fica com vaga garantida também.')],\n    en: [P('Payment will be split into three installments:'),\n         L(['25% — Sep 1, 2026','25% — Nov 1, 2026','50% — Dec 20, 2026']),\n         P(\"These dates follow the payment schedule I have with the house's owner.\"),\n         P('Your spot is secured as payments are made. If you pay early, your spot is secured early too.')] },\n\n  { key:'dropout', tag: T('SE ALGO MUDAR','IF PLANS CHANGE'),\n    title: T('3. Se alguém desistir','3. If someone drops out'),\n    pt: [P('Como a casa é reservada considerando o grupo inteiro, a desistência de uma pessoa acaba impactando todo mundo.'),\n         P('Se alguém precisar cancelar, todos nós vamos fazer o possível para encontrar outra pessoa legal e que combine com o grupo para assumir a vaga e seguir a viagem normalmente.'),\n         P('Se isso acontecer, o novo participante reembolsa diretamente quem desistiu pelos valores já pagos, e segue o jogo.'),\n         P('Caso não seja possível encontrar um substituto, infelizmente não consigo assumir esse custo sozinha. Por isso, os valores pagos não poderão ser devolvidos na ausência de um novo participante para ocupar a vaga.'),\n         P('É claro que existem situações realmente excepcionais e imprevisíveis. Se algo assim acontecer, conversamos e avaliamos juntos a melhor solução possível. Mas, como regra geral, eu, Beatriz, não me responsabilizo por cobrir financeiramente desistências individuais.')],\n    en: [P(\"Since the house is booked based on the whole group, one person dropping out ends up affecting everyone.\"),\n         P(\"If someone needs to cancel, all of us will do our best to find someone else who's cool and fits with the group to take the spot and keep the trip going as planned.\"),\n         P('If that happens, the new person reimburses whoever dropped out directly for the amounts already paid, and the trip goes on.'),\n         P(\"If we can't find a replacement, I unfortunately can't take on that cost by myself. So amounts already paid can't be refunded if no one steps in to take the spot.\"),\n         P('Of course, truly exceptional and unforeseeable situations exist. If something like that happens, we\\u2019ll talk it through and figure out the best solution together. But as a general rule, I, Beatriz, am not responsible for covering individual cancellations financially.')] },\n\n  { key:'included', tag: T('O QUE VEM JUNTO',\"WHAT'S INCLUDED\"),\n    title: T('4. O que está incluído',\"4. What's included\"),\n    pt: [P('O valor da hospedagem inclui a utilização da casa e todos os serviços previstos no contrato firmado com o proprietário, incluindo limpeza durante a estadia e cozinheira.'),\n         P('A taxa de limpeza final, cobrada pelo proprietário, será dividida igualmente entre todos os participantes.')],\n    en: [P('The accommodation fee covers use of the house and all services included in the contract signed with the owner, including cleaning during the stay and a cook.'),\n         P(\"The final cleaning fee charged by the owner will be split equally among all participants.\")] },\n\n  { key:'expenses', tag: T('RATEIO','SHARED COSTS'),\n    title: T('5. Despesas compartilhadas','5. Shared expenses'),\n    pt: [P('Além da hospedagem, algumas despesas serão divididas igualmente entre todos, como:'),\n         L(['taxa de limpeza final','energia elétrica, cobrada posteriormente conforme o consumo da casa','mercado para o café da manhã','frutas','água','gelo','itens básicos de cozinha','comidas e bebidas previamente combinadas para consumo coletivo','qualquer outro item destinado ao uso comum da casa, desde que acordado e comunicado previamente no grupo']),\n         P('Para facilitar a organização, mais perto da viagem vou enviar um formulário para entendermos as preferências, restrições alimentares e outras informações importantes de cada um. A partir dele, montaremos um mercado básico para os oito dias, com itens como café da manhã, frutas, bebidas e outros essenciais.'),\n         P('Também podemos organizar um ou mais churrascos na área externa da casa. Isso decidiremos juntos mais perto da viagem.'),\n         P('Para evitar confusão, despesas só entram no rateio quando forem previamente combinadas com o grupo. Ninguém vai aparecer do nada com uma compra surpresa no Splitwise, ok?')],\n    en: [P('Besides accommodation, some expenses will be split equally among everyone, such as:'),\n         L(['final cleaning fee','electricity, billed afterward based on the house\\u2019s usage','groceries for breakfast','fruit','water','ice','basic kitchen supplies','food and drinks agreed on in advance for shared consumption','any other item for common use of the house, as long as it\\u2019s agreed and communicated to the group beforehand']),\n         P(\"To make things easier, closer to the trip I'll send out a form to understand everyone's preferences, dietary restrictions, and other important info. Based on that, we'll put together a basic shopping list for the eight days, with items like breakfast, fruit, drinks, and other essentials.\"),\n         P(\"We can also organize one or more barbecues in the house's outdoor area. We'll decide on that together closer to the trip.\"),\n         P(\"To avoid confusion, expenses only go into the split when they've been agreed on with the group beforehand. Nobody's showing up out of nowhere with a surprise purchase on Splitwise, ok?\")] },\n\n  { key:'care', tag: T('ZELO','HOUSE CARE'),\n    title: T('6. Cuidados com a casa','6. Taking care of the house'),\n    pt: [P('A ideia é aproveitar muito a casa, mas também devolvê-la nas mesmas condições em que a recebemos.'),\n         P('Se algum dano acontecer e for possível identificar o responsável, essa pessoa assume o respectivo custo.'),\n         P('Caso o dano tenha sido causado por um convidado, a responsabilidade continua sendo de quem o convidou, caso o próprio convidado não arque com o prejuízo.'),\n         P('Se for um dano em área comum e realmente não for possível identificar o responsável, conversaremos para encontrar a solução mais justa.')],\n    en: [P('The idea is to enjoy the house a lot, but also to return it in the same condition we received it.'),\n         P('If any damage happens and the person responsible can be identified, that person covers the respective cost.'),\n         P(\"If the damage was caused by a guest, responsibility stays with whoever invited them, if the guest themselves doesn't cover the cost.\"),\n         P(\"If it's damage in a common area and it's really not possible to identify who's responsible, we'll talk it through to find the fairest solution.\")] },\n\n  { key:'belongings', tag: T('SEUS TRECOS','YOUR STUFF'),\n    title: T('7. Pertences pessoais','7. Personal belongings'),\n    pt: [P('Cada um é responsável pelos seus próprios objetos pessoais.'),\n         P('Todos os quartos são suítes e podem ser trancados, então quem preferir poderá manter seus pertences no quarto sempre que sair.'),\n         P('Ainda assim, a organização da viagem e os demais participantes não poderão ser responsabilizados por perdas, furtos ou esquecimentos de objetos pessoais.')],\n    en: [P('Everyone is responsible for their own personal belongings.'),\n         P('All rooms are en-suite and can be locked, so anyone who prefers can keep their things in the room whenever they\\u2019re out.'),\n         P(\"Even so, the trip organization and other participants can't be held responsible for lost, stolen, or forgotten personal items.\")] },\n\n  { key:'guests', tag: T('GALERA EXTRA','PLUS-ONES'),\n    title: T('8. Convidados','8. Guests'),\n    pt: [P('Convidados são bem-vindos. A ideia é, inclusive, fazer alguns afters e receber amigos ao longo da semana.'),\n         P('Só peço que todo mundo use o bom senso na hora de convidar alguém e avise o grupo.'),\n         P('Durante os afters, os convidados terão acesso apenas à área externa da casa, onde já teremos piscina, churrasqueira, banheiro, espaço para música e, provavelmente, levaremos também a mesa de sinuca para fora. Os quartos e demais áreas internas permanecem reservados aos hóspedes.'),\n         P('Como mencionado anteriormente, caso um convidado cause qualquer dano ao imóvel e não assuma a responsabilidade financeira, ela será de quem fez o convite.')],\n    en: [P('Guests are welcome. The idea is even to throw a few afters and host friends throughout the week.'),\n         P('I just ask that everyone use good judgment when inviting someone, and let the group know.'),\n         P(\"During the afters, guests will only have access to the house's outdoor area, which will already have a pool, barbecue, bathroom, space for music, and we'll probably bring the pool table outside too. The bedrooms and other indoor areas stay reserved for guests staying at the house.\"),\n         P('As mentioned before, if a guest causes any damage to the property and doesn\\u2019t take financial responsibility for it, it falls on whoever invited them.')] },\n\n  { key:'sense', tag: T('USE A CABEÇA','USE YOUR HEAD'),\n    title: T('9. Bom senso','9. Good judgment'),\n    pt: [P('Nenhum documento consegue prever todas as situações que podem acontecer numa viagem entre amigos.'),\n         P('A expectativa é que qualquer imprevisto seja resolvido com diálogo, bom senso e pensando sempre no grupo.'),\n         P('A ideia desse forms não é criar regras para tudo, mas alinhar expectativas para que a única preocupação em Carneiros seja aproveitar horrores o Réveillon.')],\n    en: [P('No document can predict every situation that might come up on a trip between friends.'),\n         P('The expectation is that anything unexpected gets solved with conversation, good judgment, and always thinking of the group.'),\n         P(\"The point of this form isn't to make rules for everything, but to align expectations so the only worry in Carneiros is enjoying the hell out of New Year's.\")] }\n];\n\nconst COVER = {\n  kicker: T('CARNEIROS · PERNAMBUCO · 2026/2027','CARNEIROS · PERNAMBUCO · 2026/2027'),\n  title: T('Réveillon Carneiros','New Year\\u2019s Eve in Carneiros'),\n  pt: [P('Como eu estou organizando toda a logística da casa, achei melhor deixar tudo escrito desde o início. Afinal, combinado não sai caro.'),\n       P('Não que eu espere problemas, mas quando um grupo grande desses viaja junto sempre surgem dúvidas, e é muito mais fácil alinhar tudo agora do que durante ou depois da viagem.'),\n       P('Este documento serve apenas para garantir que todo mundo tenha ciência e concorde com as mesmas informações sobre pagamentos, quartos, despesas compartilhadas e a dinâmica da casa.')],\n  en: [P(\"Since I'm the one organizing all the house logistics, I figured it's best to put everything in writing from the start. After all, a clear agreement never hurt anyone.\"),\n       P(\"Not that I'm expecting any problems, but whenever a group this big travels together, questions always come up, and it's much easier to align everything now than during or after the trip.\"),\n       P('This document is just to make sure everyone is aware of and agrees on the same information about payments, rooms, shared expenses, and how the house will run.')]\n};\n\nconst CONFIRM_ITEMS = {\n  pt: ['Li este documento.','Entendi como funcionarão os pagamentos.','Entendi como funcionarão as despesas compartilhadas.','Entendi a política de desistência.','Prometo não colocar compras aleatórias no Splitwise sem combinar antes.','Prometo agir civilizadamente — até onde fizer sentido.'],\n  en: [\"I've read this document.\",'I understand how the payments will work.','I understand how shared expenses will work.','I understand the cancellation policy.','I promise not to put random purchases on Splitwise without checking first.','I promise to act civilized — to the extent that makes sense.']\n};\n\nconst PS_BLOCKS = {\n  pt: [P('Organizar tantas pessoas espalhadas por diferentes lugares é um quebra-cabeça super divertido de montar! Obrigada por embarcarem nessa comigo.'),\n       P('Vamos fazer essa viagem ser aquela viagem que a gente ainda vai lembrar a cada dez anos, e se tudo der certo, que venham muito mais!')],\n  en: [P(\"Organizing this many people scattered across different places is such a fun puzzle to take! Thank you for signing up for this with me.\"),\n       P(\"Let's make this trip the trip we'll still remember every ten years, and if all goes well, may many more come!\")]\n};\nconst SIGNOFF = T('Beijinho, Bia','Kisses, Bia');\n\nconst UI = {\n  pt: { stepOf:n=>`PASSO ${n} DE 11`, back:'Voltar', next:'Próximo', begin:'Vamos',\n    confirmTag:'CONFIRMAÇÃO', confirmTitle:'Antes de assinar', confirmSubtitle:'Marque o que você já leu e entendeu:',\n    extraLabel:'Também prometo que:', extraPlaceholder:'ex: não roncar mais alto que as ondas, deixar sempre um brigadeiro pra dividir, aceitar perder no truco sem chorar...',\n    signTag:'ASSINATURA', signTitle:'Assine aqui', nameLabel:'Seu nome completo', namePlaceholder:'Como você quer aparecer na lista',\n    animalLabel:'Escolha seu bicho (um por pessoa, sem repetir)', colorLabel:'Escolha sua cor',\n    takenTag:'já escolhido', dateNote:'A data é registrada automaticamente no momento da assinatura.',\n    signButton:'Assinar e confirmar', signingButton:'Assinando...', alreadyIn:n=>`${n} já assinaram`,\n    conflictError:'Ih, alguém escolheu esse bicho agora. Escolhe outro.', offlineError:'Não consegui salvar automaticamente. Tira um print desta tela e manda pra Bia, por favor.',\n    needFields:'Preencha nome, bicho e cor pra assinar.', doneTag:'ASSINADO', doneTitle:'Você está dentro!',\n    doneSubtitle:'Bem-vindo(a) ao Réveillon em Carneiros 2026/2027.', yourStamp:'Seu selo', signedOn:'Assinado em',\n    whoSigned:'Quem já assinou', psLabel:'P.S.', openVipList:'Ver lista VIP', reread:'Reler o combinado',\n    vipButton:'lista VIP', vipCaption:'(pessoa muito importante)',\n    vipTitle:'O Livro VIP', vipSubtitle:n=>n
